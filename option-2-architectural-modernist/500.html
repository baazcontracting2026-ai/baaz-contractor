<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Server Condition | Baaz Contracting</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="assets/favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .error-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
    }
    .error-card-nordic {
      background: #FFFFFF;
      border: 1px solid var(--border-neutral);
      border-radius: var(--radius-xl);
      padding: 4rem 3rem;
      max-width: 600px;
      text-align: center;
      box-shadow: var(--shadow-floating);
    }
    .error-num {
      font-family: var(--font-mono);
      font-size: clamp(3.5rem, 8vw, 5rem);
      font-weight: 700;
      color: #DC2626;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-heading {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: var(--ink-primary);
      margin-bottom: 1rem;
    }
    .error-sub {
      color: var(--ink-secondary);
      font-size: 1.05rem;
      line-height: 1.65;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body class="error-wrap">

  <header class="header-nav">
    <div class="container header-flex">
      <a href="index.html" class="brand-wrapper">
        <img src="assets/logo.svg" alt="Baaz Contracting" class="brand-full-logo">
      </a>
      <a href="index.html" class="btn btn-outline" style="font-size: 0.88rem;">&larr; Back to Home</a>
    </div>
  </header>

  <main class="error-center">
    <div class="error-card-nordic">
      <div class="eyebrow" style="justify-content: center; margin-bottom: 1rem;">
        <span class="eyebrow-dot" style="background: #DC2626;"></span>
        Server Condition
      </div>
      <div class="error-num">500</div>
      <h1 class="error-heading">Temporary Server Interruption</h1>
      <p class="error-sub">
        Our server infrastructure encountered an unexpected processing condition. Our site engineers have been notified.
      </p>
      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <button onclick="window.location.reload()" class="btn btn-emerald">Reload Page</button>
        <a href="index.html" class="btn btn-charcoal">Return to Homepage</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom-bar" style="border-top: none; justify-content: center;">
        <div>&copy; 2026 Baaz Contracting LLC. All Rights Reserved. Built on Trust. Driven by Precision.</div>
      </div>
    </div>
  </footer>

</body>
</html>
