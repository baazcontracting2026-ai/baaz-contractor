<!-- ================================================================= -->
<!-- Google Analytics 4 (GA4) Tag with Automated Conversion Tracking   -->
<!-- Replace G-XXXXXXXXXX with your actual GA4 Measurement ID         -->
<!-- ================================================================= -->

<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  window.gtag = gtag;

  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX', {
    page_path: window.location.pathname
  });

  // Automatically track high-value conversions
  document.addEventListener('DOMContentLoaded', function() {
    // 1. Phone Call Clicks (tel: links)
    document.querySelectorAll('a[href^="tel:"]').forEach(function(el) {
      el.addEventListener('click', function() {
        gtag('event', 'click_to_call', {
          phone_number: el.getAttribute('href').replace('tel:', ''),
          link_text: el.innerText.trim(),
          page_location: window.location.href
        });
      });
    });

    // 2. Email Inquiries (mailto: links)
    document.querySelectorAll('a[href^="mailto:"]').forEach(function(el) {
      el.addEventListener('click', function() {
        gtag('event', 'click_to_email', {
          email_address: el.getAttribute('href').replace('mailto:', ''),
          page_location: window.location.href
        });
      });
    });

    // 3. Lead Form Submissions
    document.querySelectorAll('form').forEach(function(form) {
      form.addEventListener('submit', function() {
        gtag('event', 'generate_lead', {
          form_id: form.id || form.getAttribute('name') || 'contact_form',
          page_location: window.location.href
        });
      });
    });
  });
</script>
