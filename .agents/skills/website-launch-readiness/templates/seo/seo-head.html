<!-- ================================================================= -->
<!-- SEO Head Snippet for Vanilla HTML / PHP / Static Sites            -->
<!-- Replace all [PLACEHOLDERS] with real website values               -->
<!-- ================================================================= -->

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>[PRIMARY KEYWORD] | [BUSINESS NAME] - [LOCATION / USP]</title>
<meta name="title" content="[PRIMARY KEYWORD] | [BUSINESS NAME] - [LOCATION / USP]" />
<meta name="description" content="[150-160 CHARACTERS HIGH-CONVERTING META DESCRIPTION WITH CALL TO ACTION]" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://[YOUR-DOMAIN].com/" />

<!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://[YOUR-DOMAIN].com/" />
<meta property="og:title" content="[PRIMARY KEYWORD] | [BUSINESS NAME]" />
<meta property="og:description" content="[PUNCHY 120 CHAR DESCRIPTION]" />
<meta property="og:image" content="https://[YOUR-DOMAIN].com/images/og-banner.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:site_name" content="[BUSINESS NAME]" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:url" content="https://[YOUR-DOMAIN].com/" />
<meta name="twitter:title" content="[PRIMARY KEYWORD] | [BUSINESS NAME]" />
<meta name="twitter:description" content="[PUNCHY 120 CHAR DESCRIPTION]" />
<meta name="twitter:image" content="https://[YOUR-DOMAIN].com/images/og-banner.jpg" />

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#4f46e5" />

<!-- Structured Data (JSON-LD) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "[BUSINESS NAME]",
  "image": "https://[YOUR-DOMAIN].com/images/logo.png",
  "url": "https://[YOUR-DOMAIN].com",
  "telephone": "[+1-XXX-XXX-XXXX]",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "[STREET ADDRESS]",
    "addressLocality": "[CITY]",
    "addressRegion": "[STATE]",
    "postalCode": "[ZIP]",
    "addressCountry": "US"
  }
}
</script>
